# Serves the built React app and proxies /api to gunicorn (service "backend" on the compose network).
# The browser only ever talks to this server, so the API is same-origin and needs no CORS.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Plan responses are 100-500 KB of JSON; compress them (and the app bundle).
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64k;

    # Browser hardening. nginx does not inherit add_header into a location that has its own,
    # so the page and asset locations below repeat these three lines.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django's clickjacking middleware sends X-Frame-Options too; keep the one nginx adds above.
        proxy_hide_header X-Frame-Options;
        # A cold-cache cross-country plan can take ~20 s; gunicorn's own timeout is 120 s.
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Vite names bundles by content hash, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html (never cached, so a deploy is picked up at once).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
