[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Docstrings and comments quote the assessment PDF's tables verbatim (en-dashes, arrows).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "providers", "routing"]
