# Production stack: nginx (static frontend + /api proxy) in front of gunicorn.
# Configuration comes from the repository-root .env (see .env.example).
services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_CACHE_DIR: /var/cache/spotter
    volumes:
      - provider-cache:/var/cache/spotter
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  provider-cache:
